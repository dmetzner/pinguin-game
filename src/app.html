<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!--
			`viewport-fit=cover` plus the safe-area insets in app.css: the joystick and the action
			buttons sit in the bottom corners, which is exactly where a home indicator and a rounded
			display corner are. `user-scalable=no` because a double-tap zoom in the middle of a match
			is never intended — the whole surface is a control.
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#9fd8ef" />
		<meta name="mobile-web-app-capable" content="yes" />

		<!--
			Installable. The manifest is a prerendered ROUTE rather than a file in `static/`, because
			it carries the product name and `brand.ts` is the only place that is allowed to live —
			see `routes/manifest.webmanifest/+server.ts`.
		-->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

		<!--
			iOS ignores the manifest's icons and its `display` alike. `apple-mobile-web-app-capable`
			is what makes "Zum Home-Bildschirm" open without Safari's chrome — which on an iPhone is
			the ONLY way this game ever gets the whole screen, since Safari there has never
			implemented the Fullscreen API (`lib/fullscreen.ts`). `black-translucent` lets the sky run
			under the status bar, and the safe-area insets in `app.css` already keep the controls
			clear of it.
		-->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
